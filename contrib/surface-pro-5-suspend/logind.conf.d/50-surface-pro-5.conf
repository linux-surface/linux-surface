# What closing the Type Cover / pressing the power button does.
# Install to: /etc/systemd/logind.conf.d/50-surface-pro-5.conf
#
# surface-pro-5-suspend.sh --install writes this file with
# "suspend-then-hibernate" if hibernation works on your system, and with
# plain "suspend" otherwise.

[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
HandlePowerKey=suspend-then-hibernate
