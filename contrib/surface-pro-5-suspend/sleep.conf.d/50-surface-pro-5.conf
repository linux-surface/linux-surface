# systemd sleep settings for Surface Pro 5 (2017).
# Install to: /etc/systemd/sleep.conf.d/50-surface-pro-5.conf
#
# Uses the newer systemd sleep features:
#  - MemorySleepMode (systemd 256+): choose the suspend type in one place.
#    "deep" (S3) is tried first and is used if your firmware offers it.
#    Otherwise systemd uses "s2idle" (S0ix / Modern Standby, which Windows
#    uses on this device).
#  - suspend-then-hibernate with battery-aware timing (systemd 252+):
#    the device suspends normally, and hibernates when the battery runs low
#    or after HibernateDelaySec, whichever comes first. A Pro 5 left asleep
#    in a bag no longer drains to 0%.
# Older systemd versions ignore keys they don't know.

[Sleep]
AllowSuspend=yes
AllowHibernation=yes
AllowSuspendThenHibernate=yes
MemorySleepMode=deep s2idle
# Hibernate after this long asleep (or earlier, if the battery gets low).
HibernateDelaySec=3h
# How often systemd wakes briefly to estimate battery drain.
SuspendEstimationSec=1h
