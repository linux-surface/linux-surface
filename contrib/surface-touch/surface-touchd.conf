# surface-touchd configuration. After editing:
#   surface-touchd --check && sudo systemctl restart surface-touchd

# --- devices -------------------------------------------------------------
# Detected automatically (iptsd's "IPTSD Virtual Touchscreen/Stylus", or any
# direct-touch screen and pen). Set these only to force a device.
# touch_device = /dev/input/event12
# pen_device = /dev/input/event13

# --- API socket ----------------------------------------------------------
# Touch and pen data can reveal what you type on an on-screen keyboard, so
# only root and this group may use the socket. Add yourself to it:
#   sudo usermod -aG input $USER    (then log out and in)
socket_group = input
# socket = /run/surface-touchd/socket

# --- behaviour (all of these can also be changed live with surface-touchctl set)
# Screen rotation, so swipe directions match what you see: 0, 90, 180, 270
rotation = 0
# Ignore fingers while the pen is near the screen (palm rejection while
# writing), until pen_release_ms after the pen leaves.
pen_blocks_touch = false
pen_release_ms = 300

# Gesture tuning. Distances are fractions of the screen height.
# tap_ms = 250
# double_tap_ms = 300
# long_press_ms = 600
# swipe_ms = 800
# tap_move = 0.02
# swipe_min = 0.12
# edge_margin = 0.025
# pinch_start = 0.10
# rotate_start = 12
# palm_major = 0.08

# --- gesture bindings ----------------------------------------------------
#   bind GESTURE[:FINGERS][:DIRECTION] = key KEY+KEY...
#   bind GESTURE[:FINGERS][:DIRECTION] = exec COMMAND
# Gestures: tap double_tap long_press swipe edge_swipe pinch_in pinch_out
#           rotate_cw rotate_ccw
# Directions: left right up down (for edge_swipe: the edge it starts from)
# Keys: names from linux/input-event-codes.h without KEY_ (CTRL, ALT, SHIFT,
#       SUPER are aliases for the left-hand keys).
# "exec" commands run as exec_user (never as root); unset = exec disabled.
bindings = true
# exec_user = yourname

# Examples (GNOME / KDE shortcuts; adjust to your desktop):
# bind swipe:3:left = key SUPER+PAGEDOWN
# bind swipe:3:right = key SUPER+PAGEUP
# bind swipe:3:up = key SUPER
# bind swipe:4:down = key SUPER+D
# bind tap:3 = key PLAYPAUSE
# bind double_tap:2 = key CTRL+Z
# bind pinch_in:4 = key SUPER+A
# bind edge_swipe:right = exec notify-send "edge swipe"
