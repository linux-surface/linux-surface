# Load order for the IPU3 cameras on Surface Pro 4/5/6 and Surface Book 1/2.
#
# Each camera sensor (OV5693 front, OV8865 rear, OV7251 IR) gets its clock,
# power-enable GPIOs and (for the IR camera) its IR flood LED from an INT3472
# "discrete" ACPI device. If a sensor driver binds before the INT3472 driver,
# the sensor fails to probe ("failed to get clock", "dummy regulator",
# "-EPROBE_DEFER" loops) and the camera never shows up.
#
# Install to: /etc/modprobe.d/surface-ipu3-cameras.conf
# surface-camera-setup.sh --fix writes a copy that lists only the modules
# your kernel actually has.

softdep ov5693 pre: intel_skl_int3472_discrete
softdep ov8865 pre: intel_skl_int3472_discrete
softdep ov7251 pre: intel_skl_int3472_discrete
softdep ipu3_cio2 pre: ipu_bridge post: ipu3_imgu
