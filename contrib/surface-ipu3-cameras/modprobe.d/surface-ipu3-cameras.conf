# Load order for the IPU3 cameras on Surface Pro 5 / Pro 6 / Book 2.
#
# Each camera sensor (OV5693 front, OV8865 rear, OV7251 IR) gets its clock,
# power rails and GPIOs from a TPS68470 PMIC, which the INT3472 driver sets
# up. If a sensor driver binds before that PMIC driver, the sensor fails to
# probe ("failed to get clock", "dummy regulator", "-EPROBE_DEFER" loops)
# and the camera never shows up.
#
# The linux-surface kernel fixes this ordering in the ACPI core. On a stock
# distro kernel, these soft dependencies make it much more likely to work.
#
# Install to: /etc/modprobe.d/surface-ipu3-cameras.conf
# surface-camera-setup.sh --fix writes a copy that lists only the modules
# your kernel actually has.

softdep ov5693 pre: intel_skl_int3472_tps68470 tps68470-regulator clk-tps68470
softdep ov8865 pre: intel_skl_int3472_tps68470 tps68470-regulator clk-tps68470
softdep ov7251 pre: intel_skl_int3472_tps68470 tps68470-regulator clk-tps68470
softdep ipu3_cio2 pre: ipu_bridge post: ipu3_imgu
