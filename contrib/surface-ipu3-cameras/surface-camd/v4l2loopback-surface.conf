# v4l2loopback devices that surface-camd publishes the cameras on.
# Install to: /etc/modprobe.d/v4l2loopback-surface.conf
#
# exclusive_caps=1 is required for Chrome/Chromium/Electron apps to list the
# devices. If you already use v4l2loopback for something else (OBS virtual
# camera), merge these settings with yours: there can only be one
# "options v4l2loopback" line.
options v4l2loopback devices=3 video_nr=50,51,52 card_label="Surface Front Camera","Surface Rear Camera","Surface IR Camera" exclusive_caps=1,1,1
