# Optional, for use with surface-camd: stop WirePlumber from offering the
# libcamera versions of the cameras, so apps only see the surface-camd
# "Surface Front/Rear/IR Camera" devices (and libcamera can't grab the
# sensors while surface-camd needs them).
#
# Install to: ~/.config/wireplumber/wireplumber.conf.d/52-surface-camd-only.conf
# then run:   systemctl --user restart wireplumber

wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
