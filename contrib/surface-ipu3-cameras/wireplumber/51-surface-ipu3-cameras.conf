# WirePlumber 0.5+ rules for the Surface IPU3 cameras.
#
# 1. Hide the raw "ipu3-cio2" / "ipu3-imgu" V4L2 devices. These are not
#    usable cameras by themselves (they output raw Bayer data that needs the
#    ImgU + libcamera to process). When apps see them they pick them first and
#    show a black/green screen, which looks like "the camera is broken".
# 2. Give the real libcamera cameras readable names.
#
# Install to: ~/.config/wireplumber/wireplumber.conf.d/51-surface-ipu3-cameras.conf
# then run:   systemctl --user restart wireplumber

monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.driver = "~ipu3-.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]

monitor.libcamera.rules = [
  {
    matches = [
      { api.libcamera.location = "front" }
    ]
    actions = {
      update-props = {
        device.description = "Surface Front Camera"
        node.description = "Surface Front Camera"
        priority.session = 1100
      }
    }
  }
  {
    matches = [
      { api.libcamera.location = "back" }
    ]
    actions = {
      update-props = {
        device.description = "Surface Rear Camera"
        node.description = "Surface Rear Camera"
        priority.session = 1000
      }
    }
  }
]
