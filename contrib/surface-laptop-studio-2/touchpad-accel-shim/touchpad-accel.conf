# Custom libinput acceleration & scroll curves for Surface Laptop Studio 2
# ("IPTSD Virtual Touchpad 045E:0C46", ~85 units/mm: 80 X, 90 Y).
#
# In libinput's custom profile for touchpads:
#   x = finger speed in raw touchpad units/ms (0.85 u/ms = 10 mm/s)
#   y = pointer/scroll output in logical px/ms
#
# Note: for reference, stock libinput adaptive on this 80-90 u/mm pad has a
# baseline gain of ~0.13 px/unit (both motion up to 130 mm/s and scroll).
# Without an explicit scroll_points curve, libinput falls back to 1.0 px/unit
# (~7.6x faster than stock!).
#
# Motion S-curve (scaled by GNOME Touchpad Speed slider: 0 -> 1.0x):
#   0-20 mm/s   : 0.075 -> 0.095 px/unit (high precision on small targets)
#   30-100 mm/s : 0.112 -> 0.170 px/unit (smooth everyday cruise)
#   120-220 mm/s: 0.185 -> 0.260 px/unit (comfortable cross-screen flick)
#
# Scroll curve (~0.023 -> 0.042 px/unit, tuned for 85 u/mm SLS2 touchpad):
#   0-40 mm/s   : 0.023 -> 0.030 px/unit
#   50-120 mm/s : 0.033 -> 0.042 px/unit

[device "IPTSD Virtual Touchpad 045E:0C46"]
motion_step   0.85
motion_points 0.000 0.064 0.162 0.286 0.425 0.561 0.714 0.880 1.054 1.241 1.445 1.662 1.887 2.133 2.380 2.652 2.924 3.222 3.519 3.842 4.165 4.513 4.862

scroll_step   0.85
scroll_points 0.000 0.020 0.047 0.074 0.102 0.139 0.179 0.217 0.255 0.297 0.340 0.387 0.434
