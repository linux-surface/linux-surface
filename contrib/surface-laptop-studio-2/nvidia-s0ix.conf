# Enable NVIDIA S0ix (Modern Standby) participation for s2idle laptops.
# Placed in a separate file (sorting after nvidia-graphics-drivers-kms.conf)
# so NVIDIA driver upgrades do not overwrite it.
options nvidia NVreg_EnableS0ixPowerManagement=1
options nvidia NVreg_S0ixPowerManagementVideoMemoryThreshold=256
