# Minimal BlueZ (/etc/bluetooth/main.conf) snippet for Surface Slim Pen 2
# auto-reconnection (https://github.com/linux-surface/linux-surface/issues/1656).
#
# Merge these keys into your existing /etc/bluetooth/main.conf rather than
# replacing the entire file, then restart bluetooth.service and re-pair once.

[General]
# Required: enables controller privacy + Local IRK distribution during SMP
# pairing so the Slim Pen 2 marks the bond valid and advertises on reconnect.
Privacy = device

# Allows faster page/LE reconnection when the pen wakes from idle.
FastConnectable = true

# Optional: 7.5 ms BLE connection interval (6 * 1.25 ms) reduces latency for
# top-button events and Simple Haptics Controller (UsagePage 0x0E) writes.
# [LE]
# MinConnectionInterval=6
# MaxConnectionInterval=6
# ConnectionLatency=0
