# Raw IPU4 (ipu4p / intel-ipu6) is RAW10 — not a webcam.
# IR Howdy stays invisible in PipeWire (force-disabled).
# Chrome/Firefox see only Surface-Front / Surface-Back (v4l2loopback + webcamd).
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.driver = "intel-ipu6" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "~Intel IPU4.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "~.*IR-Howdy.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]
