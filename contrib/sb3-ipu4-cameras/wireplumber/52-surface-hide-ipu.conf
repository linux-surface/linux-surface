# Raw IPU4 (ipu4p / intel-ipu6) is RAW10 — not a webcam.
# guvcview/Chrome must not open CSI capture or v4l-subdev nodes (S_FMT → crash).
# Surface-IR-Howdy is last in the v4l2loopback list; Howdy preempts via webcamd.
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.driver = "intel-ipu6" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.driver = "~intel.ipu4.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.driver = "~ipu4p.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "~Intel IPU4.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.path = "~.*/v4l-subdev[0-9]+$" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]
