# Raw IPU4 (ipu4p / intel-ipu6) is RAW10 — not a webcam.
# Surface-IR-Howdy is last in the v4l2loopback list; Howdy preempts via webcamd.
# Chrome/Firefox see Front, Back, then IR (no raw IPU nodes).
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.driver = "intel-ipu6" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "~Intel IPU4.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]
