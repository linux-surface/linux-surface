# Surface RGB profiles — do not suspend. Firefox/PipeWire on suspend
# gets an empty stream on the first getUserMedia.
# Front-Standard is default (highest session priority).
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.card = "Surface-Front-Standard" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        priority.session = 2200
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "Surface-Front-HQ" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        priority.session = 2100
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "Surface-Front-Fast" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "Surface-Back-Standard" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        priority.session = 1400
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "Surface-Back-HQ" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        priority.session = 1300
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "Surface-Back-Fast" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        priority.session = 1200
      }
    }
  }
  # Legacy 3-device labels
  {
    matches = [
      { api.v4l2.cap.card = "Surface-Front" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        priority.session = 2200
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "Surface-Back" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        priority.session = 1400
      }
    }
  }
]
