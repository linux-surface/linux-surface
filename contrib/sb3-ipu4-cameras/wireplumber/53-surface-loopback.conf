# Loopback 1920x1080 YUYV — do not suspend. Firefox/PipeWire on suspend
# gets an empty stream on the first getUserMedia.
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.card = "Surface-Front" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        priority.session = 2200
      }
    }
  }
  {
    matches = [
      { api.v4l2.cap.card = "Surface-Back" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        priority.session = 1400
      }
    }
  }
]
