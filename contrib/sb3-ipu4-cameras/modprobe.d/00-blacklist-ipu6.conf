# Surface Book 3: intel-ipu6 fights IPU4 for CSE/MEI → loop of
# "FW authentication failed" / "CSE boot_load failed" and hung udevadm.
# SB3 uses surface-ipu4 (intel_ipu4p) only.
blacklist intel_ipu6
blacklist intel-ipu6
blacklist intel_ipu6_isys
blacklist intel_ipu6_psys
blacklist ipu6
blacklist ipu6_isys
blacklist ipu6_psys
install intel_ipu6 /bin/true
install intel-ipu6 /bin/true
