# Surface Book 3: early intel-ipu4 probe fights NVIDIA for CSE/MEI,
# can loop on "CSE authenticate_run failed" and block udevadm settle
# so the display manager hangs. Load IPU after the greeter
# (surface-ipu4-late.service).
blacklist intel_ipu4p
blacklist intel_ipu4p_isys
blacklist intel_ipu4p_psys
blacklist intel_ipu4p_isys_csslib
blacklist intel_ipu4p_psys_csslib
blacklist intel-ipu4p
blacklist intel-ipu4p-isys
blacklist intel-ipu4p-psys
