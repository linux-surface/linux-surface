%YAML 1.1
---
# SOURCE: https://github.com/ConsultingFuture4200/sp7-camera/tree/main/ipa/simple
#
# libcamera "simple" IPA tuning for ov5693.
# Colour matrices converted from OV5693_MSHW0190_ICL.cpf
# (Intel CPF advanced_color_matrices -> traditional_matrix per illuminant,
#  colour temperature derived from CIE xy via McCamy's approximation).
# Black level is intentionally omitted so the BlackLevel algorithm measures it;
# the pedestal in the CPF reflects Windows' sensor configuration, not this driver's.
version: 1
algorithms:
  - BlackLevel:
  - Awb:
  - Ccm:
      ccms:
        # Intel light_source 1
        - ct: 2664
          ccm: [  1.6161, -0.3693, -0.2467,
                 -0.4316,  1.7420, -0.3104,
                 -0.2145, -1.1669,  2.3815 ]
        # Intel light_source 19
        - ct: 3479
          ccm: [  1.7649, -0.6068, -0.1581,
                 -0.4043,  1.7496, -0.3452,
                 -0.1520, -0.5956,  1.7475 ]
        # Intel light_source 10
        - ct: 4004
          ccm: [  2.2535, -1.1894, -0.0641,
                 -0.3690,  1.5321, -0.1631,
                 -0.0677, -0.6720,  1.7398 ]
        # Intel light_source 4
        - ct: 4556
          ccm: [  1.7293, -0.5211, -0.2082,
                 -0.2936,  1.7611, -0.4675,
                 -0.0712, -0.6737,  1.7449 ]
        # Intel light_source 6
        - ct: 6254
          ccm: [  1.5505, -0.3922, -0.1583,
                 -0.2548,  1.6861, -0.4313,
                 -0.0920, -0.4237,  1.5157 ]
        # Intel light_source 7
        - ct: 7053
          ccm: [  1.7066, -0.6015, -0.1050,
                 -0.2240,  1.6459, -0.4219,
                 -0.0520, -0.4745,  1.5265 ]
  - Adjust:
  - Agc:
...
