# Front and Back visible. IR Howdy hidden.
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.card = "Surface-Front-Standard" } ]
    actions = { update-props = {
      device.disabled = false, node.disabled = false, device.ignore = false,
      node.pause-on-idle = true, session.suspend-timeout-seconds = 3, priority.session = 2400
    } }
  }
  {
    matches = [ { api.v4l2.cap.card = "Surface-Front-HQ" } ]
    actions = { update-props = {
      device.disabled = false, node.disabled = false, device.ignore = false,
      node.pause-on-idle = true, session.suspend-timeout-seconds = 3, priority.session = 2350
    } }
  }
  {
    matches = [ { api.v4l2.cap.card = "Surface-Front-Fast" } ]
    actions = { update-props = {
      device.disabled = false, node.disabled = false, device.ignore = false,
      node.pause-on-idle = true, session.suspend-timeout-seconds = 3, priority.session = 2320
    } }
  }
  {
    matches = [ { api.v4l2.cap.card = "Surface-Back-Standard" } ]
    actions = { update-props = {
      device.disabled = false, node.disabled = false, device.ignore = false,
      node.pause-on-idle = true, session.suspend-timeout-seconds = 3, priority.session = 2300
    } }
  }
  {
    matches = [ { api.v4l2.cap.card = "Surface-Back-HQ" } ]
    actions = { update-props = {
      device.disabled = false, node.disabled = false, device.ignore = false,
      node.pause-on-idle = true, session.suspend-timeout-seconds = 3, priority.session = 2250
    } }
  }
  {
    matches = [ { api.v4l2.cap.card = "Surface-Back-Fast" } ]
    actions = { update-props = {
      device.disabled = false, node.disabled = false, device.ignore = false,
      node.pause-on-idle = true, session.suspend-timeout-seconds = 3, priority.session = 2200
    } }
  }
  {
    matches = [ { api.v4l2.cap.card = "Surface-IR-Howdy" } ]
    actions = { update-props = { device.disabled = true, node.disabled = true, device.ignore = true } }
  }
]
