# PipeWire speaker EQ for the Surface Pro 5 internal speakers.
#
# Creates a virtual output called "Surface Pro 5 Speakers (EQ)". Audio sent to it is
# equalized and passed on to the built-in speakers. These values are a
# starting point tuned for small tablet drivers; adjust to taste.
#
#   High-pass 140 Hz  - below this the drivers only distort and rattle, so
#                       removing it lets them play louder and cleaner
#   +4.0 dB @ 220 Hz   - adds warmth/body right above the driver's limit
#   -2.5 dB @ 480 Hz    - removes the "boxy"/"tin can" resonance of the chassis
#   -2.0 dB @ 3200 Hz   - tames harshness/sibilance at higher volume
#   +2.0 dB @ 6000 Hz  - restores vocal presence and clarity
#   +3.0 dB shelf @ 10000 Hz - air/detail
#   Pre-gain x0.56 - leaves headroom for the boosts so nothing clips
#
# Install with ./install-speaker-eq.sh (fills in SPEAKER_SINK_NAME), or copy to
# ~/.config/pipewire/pipewire.conf.d/ and replace SPEAKER_SINK_NAME with your
# speaker sink's node.name (see: pactl list short sinks).

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Surface Pro 5 Speakers (EQ)"
      media.name       = "Surface Pro 5 Speakers (EQ)"
      filter.graph = {
        nodes = [
          { type = builtin name = pregain  label = linear       control = { "Mult" = 0.56 "Add" = 0.0 } }
          { type = builtin name = hipass   label = bq_highpass  control = { "Freq" = 140.0 "Q" = 0.707 } }
          { type = builtin name = body     label = bq_peaking   control = { "Freq" = 220.0 "Q" = 1.0 "Gain" = 4.0 } }
          { type = builtin name = mud      label = bq_peaking   control = { "Freq" = 480.0 "Q" = 1.2 "Gain" = -2.5 } }
          { type = builtin name = harsh    label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 1.8 "Gain" = -2.0 } }
          { type = builtin name = presence label = bq_peaking   control = { "Freq" = 6000.0 "Q" = 1.0 "Gain" = 2.0 } }
          { type = builtin name = air      label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.707 "Gain" = 3.0 } }
        ]
        links = [
          { output = "pregain:Out"  input = "hipass:In" }
          { output = "hipass:Out"   input = "body:In" }
          { output = "body:Out"     input = "mud:In" }
          { output = "mud:Out"      input = "harsh:In" }
          { output = "harsh:Out"    input = "presence:In" }
          { output = "presence:Out" input = "air:In" }
        ]
      }
      # The graph is mono; filter-chain runs one copy per channel.
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "effect_input.surface_speaker_eq"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name      = "effect_output.surface_speaker_eq"
        node.passive   = true
        target.object  = "SPEAKER_SINK_NAME"
        node.dont-reconnect = true
      }
    }
  }
]
