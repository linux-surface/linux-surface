# SPDX-License-Identifier: CC0-1.0
#
# libcamera simple-IPA tuning for the Omnivision OV13858 on the Microsoft
# Surface Pro 11 for Business (Intel).
#
# blackLevel MEASURED: mean 64.21, median 64 across all four Bayer channels.
#
# No Ccm. The matrices that worked here are Intel's, read out of the Windows
# driver's tuning data, and these files carry only what was measured on this
# machine. Without one the colour is flatter than it could be.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Adjust:
  - Agc:
...
