name: Arch

env:
  GPG_KEY_ID: 56C464BAAC421453

on:
  repository_dispatch:

  # Manual build, optionally releasing the packages
  workflow_dispatch:
    inputs:
      release:
        description: 'Release the packages: tag the built commit (tag name based on the package version) and publish the packages to the package repository'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          VERSIONS="$(bash ./.github/scripts/autoupdate/package/arch.sh current)"
          VERSION="$(echo "${VERSIONS}" | sed -n 's/^version=//p')"
          REVISION="$(echo "${VERSIONS}" | sed -n 's/^release=//p')"
          TAG="arch-${VERSION}-${REVISION}"

          echo "Release tag: ${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          # Fail early instead of after the build
          if [ "${RELEASE}" = "true" ] && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists, bump the package release to release a new build"
            exit 1
          fi

      - name: Initialize containers
        run: |
          bash ./.github/scripts/container/create.sh \
            archlinux

      - name: Install build dependencies
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/arch.sh setup-builddeps

      - name: Setup secureboot certificate
        env:
          SB_KEY: ${{ secrets.SURFACE_SB_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SB_KEY \
            -- \
            bash ./.github/scripts/package/arch.sh setup-secureboot

      - name: Build packages
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/arch.sh build-packages

      - name: Sign packages
        env:
          GPG_KEY: ${{ secrets.LINUX_SURFACE_GPG_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e GPG_KEY \
            -e GPG_KEY_ID \
            -- \
            bash ./.github/scripts/package/arch.sh sign-packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arch-latest
          path: pkg/arch/kernel/release

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: arch-latest
          path: arch-latest

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.LINUX_SURFACE_BOT_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "${TAG}" -R "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "${TAG}" --notes "" ./*-latest/*

  repo:
    name: Update package repository
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: arch-latest
          path: arch-latest

      - name: Initialize containers
        run: |
          bash ./.github/scripts/container/create.sh \
            archlinux

      - name: Update repository
        env:
          SURFACEBOT_TOKEN: ${{ secrets.LINUX_SURFACE_BOT_TOKEN }}
          GIT_REF: refs/tags/${{ needs.build.outputs.tag }}
          BRANCH_STAGING: u/staging
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SURFACEBOT_TOKEN \
            -e GIT_REF \
            -e BRANCH_STAGING \
            -e GITHUB_REPOSITORY \
            -- \
            bash ./.github/scripts/repository/arch.sh
