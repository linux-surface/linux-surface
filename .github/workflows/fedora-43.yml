name: Fedora 43

env:
  FEDORA: 43
  GPG_KEY_ID: 56C464BAAC421453

on:
  # Test builds for automatic package updates. These packages are released
  # after merging (see release-package.yml).
  pull_request:
    paths:
      - 'pkg/fedora/kernel-surface/**'

  repository_dispatch:

  # Manual build, optionally releasing the packages
  workflow_dispatch:
    inputs:
      release:
        description: 'Release the packages: tag the built commit (tag name based on the package version) and publish the packages to the package repository'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # Only build pull requests from our autoupdate branches
    if: >-
      github.event_name != 'pull_request' || (
        startsWith(github.head_ref, 'autoupdate/') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          VERSIONS="$(bash ./.github/scripts/autoupdate/package/fedora.sh current)"
          VERSION="$(echo "${VERSIONS}" | sed -n 's/^version=//p')"
          REVISION="$(echo "${VERSIONS}" | sed -n 's/^release=//p')"
          TAG="fedora-${FEDORA}-${VERSION}-${REVISION}"

          echo "Release tag: ${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          # Fail early instead of after the build
          if [ "${RELEASE}" = "true" ] && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists, bump the package release to release a new build"
            exit 1
          fi

      - name: Initialize containers
        run: |
          bash ./.github/scripts/container/create.sh \
            registry.fedoraproject.org/fedora:${{ env.FEDORA }}

      - name: Install build dependencies
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-builddeps

      - name: Setup secureboot certificate
        env:
          SB_KEY: ${{ secrets.SURFACE_SB_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SB_KEY \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-secureboot

      - name: Build packages
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh build-packages

      - name: Sign packages
        env:
          GPG_KEY: ${{ secrets.LINUX_SURFACE_GPG_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e GPG_KEY \
            -e GPG_KEY_ID \
            -- \
            bash ./.github/scripts/package/fedora.sh sign-packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ env.FEDORA }}-latest
          path: pkg/fedora/kernel-surface/out/x86_64

      - name: Record build inputs
        run: |
          bash ./.github/scripts/package/build-inputs.sh fedora > build-inputs.txt
          cat build-inputs.txt

      - name: Upload build inputs
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ env.FEDORA }}-inputs
          path: build-inputs.txt

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: fedora-${{ env.FEDORA }}-latest
          path: fedora-${{ env.FEDORA }}-latest

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.LINUX_SURFACE_BOT_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "${TAG}" -R "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "${TAG}" --notes "" ./*-latest/*

  repo:
    name: Update package repository
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: fedora-${{ env.FEDORA }}-latest
          path: fedora-${{ env.FEDORA }}-latest

      - name: Initialize containers
        run: |
          bash ./.github/scripts/container/create.sh \
            registry.fedoraproject.org/fedora:${{ env.FEDORA }}

      - name: Update repository
        env:
          SURFACEBOT_TOKEN: ${{ secrets.LINUX_SURFACE_BOT_TOKEN }}
          GIT_REF: refs/tags/${{ needs.build.outputs.tag }}
          BRANCH_STAGING: u/staging
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SURFACEBOT_TOKEN \
            -e GIT_REF \
            -e BRANCH_STAGING \
            -e GITHUB_REPOSITORY \
            -- \
            bash ./.github/scripts/repository/fedora.sh ${{ env.FEDORA }}
